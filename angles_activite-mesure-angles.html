<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesure d'angles</title>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<style>
  :root{
    --bleu-fonce: #1d3557;
    --bleu: #457b9d;
    --fond: #f1f4f8;
    --vert: #2a9d5c;
    --vert-fond: #e6f6ec;
    --rouge: #d64545;
    --rouge-fond: #fbe9e9;
    --gris-clair: #e2e6ec;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; height:100%; font-family: sans-serif; background: var(--fond); }
  [hidden]{ display:none !important; }

  #bandeau{ height:64px; background: var(--bleu-fonce); color:#fff; display:flex; align-items:center; justify-content:space-between; padding: 0 24px; }
  #bandeau button{ cursor:pointer; }
  #conteneur-principal{ height: calc(100vh - 64px); display:flex; }
  .panneau-consigne{ width:400px; background:#fff; padding:24px; display:flex; flex-direction:column; gap:16px; border-right:1px solid var(--gris-clair); overflow-y:auto; }
  .etapes-box{ background: #f8fafc; border: 1px solid var(--gris-clair); border-radius: 8px; padding: 14px; }
  .etapes-box p{ margin:0 0 10px; }
  .etapes-box b{ color: var(--bleu); }
  .etapes-box ol{ margin:0; padding-left:20px; }
  .btn-action{ width:100%; padding:12px; background: var(--bleu-fonce); color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600; }
  .btn-action:hover{ background: var(--bleu); }
  .btn-action:disabled{ opacity:.5; cursor:default; }
  .btn-action.sec{ background:#fff; color:var(--bleu-fonce); border:1px solid var(--bleu-fonce); }
  .zone-retour-msg{ padding:12px; border-radius:8px; margin-top:10px; display:none; }
  .zone-retour-msg ul{ margin:8px 0 0; padding-left:20px; }
  .zone-retour-msg li{ margin-bottom:4px; }
  .succes{ background: var(--vert-fond); color: var(--vert); border:1px solid #b7e3c6; display:block !important;}
  .erreur{ background: var(--rouge-fond); color: var(--rouge); border:1px solid #f0bcbc; display:block !important;}
  .panneau-ggb{ flex:1; background:#fff; }
  .niveau{ display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:12px; background:var(--gris-clair); color:var(--bleu-fonce); margin-bottom:4px; align-self:flex-start; }
  .reponse{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:600; color:var(--bleu-fonce); }
  .reponse input{ width:110px; padding:10px; font-size:18px; border:1px solid var(--bleu); border-radius:8px; }
  .astuce{ background:#fff8e6; border:1px solid #f0d9a0; color:#6b5200; border-radius:8px; padding:12px; line-height:1.5; }
  @media(max-width:900px){
    #conteneur-principal{ flex-direction:column; height:auto; }
    .panneau-consigne{ width:100%; border-right:none; }
    .panneau-ggb{ height:70vh; }
  }
</style>
</head>
<body>

<div id="bandeau">
  <div>Mesure d'angles</div>
  <button id="new">🔄 Nouvelle série</button>
</div>

<div id="conteneur-principal">
  <div class="panneau-consigne">
    <span class="niveau" id="niveau-ex"></span>
    <div class="etapes-box">
      <p id="cons"></p>
      <ol id="how">
        <li>Glisse le point O (centre de l'équerre) sur S.</li>
        <li>Tourne l'équerre avec le point A pour poser sa base sur l'un des côtés de l'angle.</li>
        <li>Lis la graduation à l'endroit où passe l'autre côté, puis écris la mesure.</li>
      </ol>
    </div>
    <div class="reponse" id="zrep"><label for="rep">Mesure de l'angle P₁ŜP₂ =</label><input id="rep" inputmode="decimal" autocomplete="off" size="5"> °</div>
    <button class="btn-action" id="verif">Vérifier ma mesure</button>
    <button class="btn-action sec" id="tip">💡 Astuce</button>
    <button class="btn-action sec" id="sol" hidden>Voir la solution</button>
    <button class="btn-action" id="next" hidden>Exercice suivant</button>
    <div id="hint" class="astuce" hidden></div>
    <div id="fb" class="zone-retour-msg" role="status" aria-live="polite"></div>
  </div>
  <div class="panneau-ggb" id="ggb-container"></div>
</div>

const TOL=2, PI=Math.PI, R=5, TR=11, N=10, YR=26;
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const rng=(a,b)=>Array.from({length:b-a+1},(_,k)=>a+k);
const A10=[30,40,50,60,70,80],A5=[35,45,55,65,75,85],O10=[100,110,120,130,140,150],O5=[105,115,125,135,145,155];
const CV5=[...A10,...A5,...O10,...O5], CVI=rng(20,160).filter(x=>Math.abs(x-90)>4);
const RF10=[...A10,...O10].map(x=>360-x), RF=CV5.map(x=>360-x), RFI=CVI.map(x=>360-x);
const PLAN=[A10,O10,A5,O5,RF10,CV5,CVI,RF,RFI,[...CVI,...RFI]];
let g=null,ser=[],i=0,tries=0,res=[],locked=false,XR=33;

function build(){
  const used=[];
  ser=PLAN.map(p=>{let t;do{t=rnd(p)}while(used.includes(t)&&p.some(v=>!used.includes(v)));used.push(t);
    return{t,th:Math.floor(Math.random()*360),flip:Math.random()<.5}});
  res=[];i=0;
}
function dots(){$('niveau-ex').textContent=`Exercice ${i+1} sur ${N}`}
function fb(k,m){const f=$('fb');
  if(!k){f.className='zone-retour-msg';f.textContent='';return}
  f.className='zone-retour-msg '+(k=='ok'?'succes':'erreur');
  f.innerHTML=k=='ko'?"Ce n'est pas encore correct. Voici ce qu'il faut revoir :<ul><li>"+m+"</li></ul>":m}
const SX=()=>g.getXcoord('S'), SY=()=>g.getYcoord('S');
const pos=(th,s)=>{const a=(th+s)*PI/180;return[SX()+R*Math.cos(a),SY()+R*Math.sin(a)]};
const ang=n=>Math.atan2(g.getYcoord(n)-SY(),g.getXcoord(n)-SX())*180/PI;
const cat=x=>x<90?'aigu':x<180?'obtus':'rentrant';
const parse=v=>{const s=v.replace(',','.').replace('°','').trim();return /^\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN};

function start(){
  const e=ser[i],ref=e.t>180?360-e.t:e.t,p=e.flip?360-ref:ref,h=Math.max(XR/2-TR-1,1);
  tries=0;locked=false;
  g.setFixed('S',false,true);g.setCoords('S',(Math.random()*2-1)*h,(Math.random()*2-1)*1.5);g.setFixed('S',true,false);
  g.setFixed('P_1',false,true);g.setCoords('P_1',...pos(e.th,0));g.setFixed('P_1',true,false);
  g.setFixed('P_2',false,true);g.setCoords('P_2',...pos(ang('P_1'),p));g.setFixed('P_2',true,false);
  const w=Math.abs(p-e.t)<.5?'a':'b';g.setVisible('sa',w=='a');g.setVisible('sb',w=='b');
  const mx=SX()<0?XR/2-TR-1:-XR/2+TR+1,my=(Math.random()*2-1)*1.5;
  g.setCoords('O',mx,my);g.setCoords('A',mx-TR,my);
  g.setVisible('pr',false);
  $('cons').innerHTML="Mesure avec l'équerre l'angle P₁ŜP₂ marqué en bleu, puis écris sa mesure en degrés.";
  $('zrep').hidden=false;$('rep').value='';$('rep').disabled=false;
  $('verif').disabled=false;$('sol').hidden=true;$('next').hidden=true;$('how').hidden=false;$('hint').hidden=true;
  fb();dots();
}
function judge(a,t){
  const rf=t>180,ref=360-t,d=a-t,ad=Math.abs(d),more=d>0?'trop grande':'trop petite',B=TOL+2;
  if(ad<=TOL)return['ok',ad==0?`Bravo ! L'angle P₁ŜP₂ mesure bien ${t}°.`:`Bravo ! Ta valeur est acceptée : la mesure exacte est ${t}°.`];
  if(!rf&&a>180)return['ko',"L'angle marqué en bleu est plus petit qu'un angle plat : sa mesure est inférieure à 180°."];
  if(!rf&&Math.abs(a-(180-t))<=B)return['ko',"Ta valeur correspond à 180° moins la mesure de l'angle : tu as sûrement lu la mauvaise échelle. Prends la graduation qui part de 0° sur le côté où tu as posé la base."];
  if(rf&&a<=180){
    if(Math.abs(a-ref)<=B)return['ko',"Tu as donné la mesure de l'angle saillant (la partie non colorée). L'angle marqué en bleu est un angle rentrant : sa mesure dépasse 180°."];
    if(Math.abs(a-(t-180))<=B)return['ko',"Tu as mesuré à partir de la prolongation d'un côté : n'oublie pas d'ajouter 180°."];
    return['ko',"L'angle marqué en bleu est un angle rentrant : sa mesure est supérieure à 180°. Clique sur 💡 Astuce si tu hésites."];
  }
  if(rf&&Math.abs(a-(540-t))<=B)return['ko',"Tu as sûrement lu la mauvaise échelle en mesurant à partir de la prolongation d'un côté."];
  if(!rf&&cat(a)!==cat(t))return['ko',`L'angle marqué en bleu est ${cat(t)} (${t<90?'moins':'plus'} de 90°) : ta valeur ne convient pas.`];
  if(ad<=6)return['ko',`Presque ! Ta valeur est un peu ${more}. Vérifie que O est bien sur S, que la base est alignée sur un côté de l'angle et relis bien la graduation.`];
  if(Math.abs(ad-10)<=3)return['ko',"Il y a un décalage d'environ 10° : compte bien les petites graduations entre deux nombres."];
  return['ko',`Ta valeur est ${more}. Recommence : O sur S, base de l'équerre sur un côté de l'angle, puis lis la graduation à l'endroit où passe l'autre côté.`];
}
function finish(){
  locked=true;$('verif').disabled=true;$('rep').disabled=true;$('sol').hidden=true;
  $('next').textContent=i==N-1?'Voir mon bilan':'Exercice suivant';$('next').hidden=false;dots();
}
function verif(){
  if(locked||!g)return;
  const a=parse($('rep').value);
  if(isNaN(a)){fb('ko',"Écris la mesure de l'angle avec des chiffres (par exemple : 65).");return}
  tries++;const[k,m]=judge(a,ser[i].t);fb(k,m);
  if(k=='ok'){res[i]=tries==1?'ok1':'ok';finish()}
  else if(tries>=3)$('sol').hidden=false;
}
$('verif').onclick=verif;
$('rep').onkeydown=ev=>{if(ev.key=='Enter')verif()};
function solFn(){
  const t=ser[i].t;res[i]='sol';
  fb('sol',`La mesure de l'angle P₁ŜP₂ est ${t}°.${t>180?` C'est un angle rentrant : ${t}° = 180° + ${t-180}° = 360° − ${360-t}°.`:''}`);finish();
}
$('sol').onclick=solFn;
$('tip').onclick=()=>{
  g.setVisible('pr',true);
  $('hint').innerHTML="<b>Astuce</b> si l'angle est plus grand que 180° (angle rentrant) : l'équerre ne mesure pas plus de 180°.<br>• Mesure l'angle saillant (la partie non colorée), puis calcule 360° − cette mesure.<br>• Ou prolonge [SP₁ de l'autre côté de S (trait en pointillés), mesure l'angle entre cette prolongation et [SP₂, puis ajoute 180°.";
  $('hint').hidden=false;
};
$('next').onclick=()=>{
  if(i<N-1){i++;start();return}
  const c=k=>res.filter(r=>r==k).length;
  $('cons').innerHTML=`Bilan : <b>${c('ok1')}/${N}</b> angles mesurés correctement du premier coup, ${c('ok')} après une correction, ${c('sol')} avec la solution.`;
  $('how').hidden=true;$('zrep').hidden=true;$('verif').disabled=true;$('next').hidden=true;$('hint').hidden=true;g.setVisible('pr',false);
  fb();$('niveau-ex').textContent='Bilan de la série';
};
$('new').onclick=()=>{if(g){build();start()}};

function ready(api){
  g=api;
  ['D','f','w','Consigne','Retour','Text2','verif','cible'].forEach(o=>{try{g.deleteObject(o)}catch(x){}});
  g.renameObject('M','O');g.evalCommand('c=Circle(O,'+TR+')');g.setAxesVisible(false,false);g.setGridVisible(false);g.setVisible('α',false);
  g.evalCommand('S=(0,0)');
  g.evalCommand('cc=Circle(S,'+R+')');g.setVisible('cc',false);g.evalCommand('P_2=Point(cc)');
  g.evalCommand('sa=CircularSector(S,P_1,P_2)');g.evalCommand('sb=CircularSector(S,P_2,P_1)');
  ['sa','sb'].forEach(o=>{g.setColor(o,69,123,157);g.setFilling(o,0.2);g.setLineThickness(o,4);g.setLabelVisible(o,false);g.setVisible(o,false)});
  g.evalCommand('pr=Ray(S,E)');g.setColor('pr',110,110,110);g.setLineStyle('pr',1);g.setLineThickness('pr',3);g.setLabelVisible('pr',false);g.setVisible('pr',false);
  ['P_1','P_2','A'].forEach(o=>g.setLabelVisible(o,true));
  g.setPointSize('P_2',6);g.setPointSize('A',5);
  const c=$('ggb-container');XR=YR*c.clientWidth/c.clientHeight;
  g.setCoordSystem(-XR/2,XR/2,-YR/2,YR/2);
  build();start();
}
if(window.GGBApplet){
  new GGBApplet({appName:"classic",width:$('ggb-container').clientWidth,height:$('ggb-container').clientHeight,ggbBase64:GGB,appletOnLoad:ready,
    showToolBar:false,showAlgebraInput:false,showMenuBar:false,showResetIcon:false,
    enableRightClick:false,enableLabelDrags:false,enableShiftDragZoom:false,
    language:"fr",borderColor:null},true).inject('ggb-container');
}else{$('ggb-container').textContent="Impossible de charger GeoGebra : vérifie ta connexion Internet puis recharge la page."}
dots();
</script>
